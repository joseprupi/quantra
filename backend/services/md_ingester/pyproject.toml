[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantra-md-ingester"
version = "0.4.1"
description = "Scheduled worker that writes vendor data into the md.* schema. Off the request path."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Quantra Engineering" }]
keywords = ["quantra", "market-data", "ingester", "worker"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "quantra-common",
    # BoE government nominal-curve adapter pulls XLSX archives.
    # openpyxl is only needed inside this service so it does not
    # belong in quantra-common.
    "openpyxl>=3.1",
]

[project.scripts]
quantra-md-ingester = "quantra_md_ingester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantra_md_ingester"]

# Vendor JSON configs ship inside the wheel so a container run uses the
# exact specs the build was cut from. Without this, hatchling's default
# wheel includes .py files only and the connectors would fall back to
# the "config not found" branch at runtime.
[tool.hatch.build.targets.wheel.force-include]
"src/quantra_md_ingester/configs" = "quantra_md_ingester/configs"
