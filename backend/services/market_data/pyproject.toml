[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantra-market-data"
version = "0.4.2"
description = "Quantra market data read service. Read-only on the request path; ingestion runs in `quantra-md-ingester`."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Quantra Engineering" }]
keywords = ["quantra", "market-data"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "quantra-common",
    # FastAPI/SQLAlchemy/asyncpg/pydantic come transitively from quantra-common.
    # uvicorn is the production server entry point and is service-local because
    # the orchestrator and ingester pick their own runners.
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantra_market_data"]
