###############################################################################
# Alembic config for the Quantra backend monorepo.
#
# One Alembic environment, two logical schemas (app.* and md.*) inside a
# single Postgres instance — see decisions log D6.
#
# Each schema gets its own version table (`alembic_version_app` /
# `alembic_version_md`) and its own ``versions/<schema>/`` directory so
# migrations advance independently. The schema is selected per invocation
# with Alembic's named-section flag:
#
#     uv run alembic -n app upgrade head
#     uv run alembic -n md  upgrade head
#
# Both sections share a single ``env.py`` under ``script_location``;
# ``env.py`` derives the schema from ``config.config_ini_section`` and
# reads its version table out of the section.
#
# Revision naming: per-schema sequential, zero-padded ("0001_init.py",
# "0002_*.py"). Picked over timestamps for readability and because the
# two schemas keep separate counters.
###############################################################################

[alembic]
# Intentionally minimal. Running `alembic` without `-n {app,md}` is a
# user error — `env.py` raises in that case so we don't silently apply
# the wrong version table.
script_location = migrations/alembic
prepend_sys_path = .
output_encoding = utf-8
sqlalchemy.url =

[app]
script_location = migrations/alembic
version_locations = migrations/alembic/versions/app
version_table = alembic_version_app
version_table_schema = public
sqlalchemy.url =

[md]
script_location = migrations/alembic
version_locations = migrations/alembic/versions/md
version_table = alembic_version_md
version_table_schema = public
sqlalchemy.url =

###############################################################################
# Logging — quiet defaults; alembic itself logs at INFO.
###############################################################################
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
