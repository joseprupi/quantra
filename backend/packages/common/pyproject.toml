[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantra-common"
version = "0.4.2"
description = "Shared library for Quantra backend services (auth, db, settings, logging, MD/engine clients, types)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Quantra Engineering" }]
keywords = ["quantra", "shared", "backend"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "firebase-admin>=6.5",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "starlette>=0.41",
    "structlog>=24.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantra_common"]
