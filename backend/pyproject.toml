###############################################################################
# Workspace root for `quantra-backend`.
#
# This is a uv "virtual workspace": there is no top-level package to build, but
# all members listed below share a single lockfile and `.venv`. See
# https://docs.astral.sh/uv/concepts/projects/workspaces/ for the model.
#
# Workspace tool decision is recorded in `redesign_plan/02_decisions_log.md`
# (see D16 — uv chosen over Poetry / plain pip).
###############################################################################

[tool.uv.workspace]
members = [
    "packages/common",
    "services/orchestrator",
    "services/market_data",
    "services/md_ingester",
]

# Tell uv that any cross-member dependency expressed as a normal requirement
# should be resolved from the workspace, not PyPI.
[tool.uv.sources]
quantra-common = { workspace = true }
quantra-orchestrator = { workspace = true }
quantra-market-data = { workspace = true }
quantra-md-ingester = { workspace = true }

# PEP 735 dependency groups. Shared dev tooling lives at the workspace root so
# every member sees the same ruff / mypy / pytest versions.
[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    # Type stubs for the engine-client wiring (orchestrator/05).
    # ``quantra-orchestrator`` takes ``grpcio`` as a service-local
    # runtime dep; the stubs are dev-only because they're only needed
    # by mypy.
    "types-grpcio>=1.0.0",
]

###############################################################################
# Tool configuration shared across the workspace
###############################################################################

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/common/src",
    "services/orchestrator/src",
    "services/market_data/src",
    "services/md_ingester/src",
]
extend-exclude = [
    ".venv",
    "migrations/alembic/versions",
    # Vendored FlatBuffers bindings (D83) — generated by `flatc`
    # and managed by `scripts/regen_engine_bindings.sh`. We don't
    # lint generated code; the regen script is the audit trail.
    "packages/common/src/quantra_common/engine_client/_generated",
]

[tool.ruff.lint]
# Strict-leaning starter set. Rationale recorded in `02_decisions_log.md` D17.
# Each rule family is enabled deliberately; if a family becomes too noisy we
# narrow it rather than disable it wholesale.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "PL",   # pylint (subset enabled by default)
    "ANN",  # flake8-annotations (drives Python type-hint discipline)
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
]
ignore = [
    "PLR0913",# too-many-arguments — revisit per-service if it bites
    "S101",   # use of `assert` — fine in tests; per-file override below
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",    # asserts are the point of pytest
    "ANN",     # don't require full annotations on tests
    "PLR2004", # magic numbers are common in tests
]
"**/__init__.py" = ["F401"]  # re-exports

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` / `Query(...)` / `Path(...)` / `Body(...)` are
# the documented way to declare a dependency or parameter and *must*
# appear in the default argument. They are immutable-by-design markers.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = [
    "quantra_common",
    "quantra_orchestrator",
    "quantra_market_data",
    "quantra_md_ingester",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

###############################################################################
# mypy — strict by default. Loosened only by explicit per-module overrides.
###############################################################################

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/common/src",
    "services/orchestrator/src",
    "services/market_data/src",
    "services/md_ingester/src",
]
exclude = [
    "^.venv/",
    "^migrations/alembic/versions/",
    "^build/",
    "^dist/",
    # Vendored FlatBuffers bindings (D83). The generated modules
    # have no annotations and bypass strict-mode runtime invariants
    # we expect of first-party code; mypy treats them as opaque.
    "^packages/common/src/quantra_common/engine_client/_generated/",
]

# openpyxl does not ship type stubs and the third-party `types-openpyxl`
# package is incomplete for the read_only workbook code path the BoE
# nominal-curve connector uses. Allow untyped imports for that one
# module only — the connector wraps every openpyxl call in narrow,
# typed helpers so the rest of the code stays strict.
[[tool.mypy.overrides]]
module = ["openpyxl"]
ignore_missing_imports = true

# Vendored FlatBuffers bindings (D83) are auto-generated by `flatc`
# and ship without type annotations. The upstream `flatbuffers`
# package also ships no stubs. Both are flagged ``follow_imports =
# skip`` so callers that ``import
# quantra_common.engine_client._generated.quantra.*`` (and the
# bindings' ``import flatbuffers`` themselves) typecheck without
# touching the strictness baseline. The orchestrator's per-product
# `engine_io.py` modules wrap every binding call in a narrow,
# typed helper so the rest of the code stays strict.
[[tool.mypy.overrides]]
module = [
    "quantra_common.engine_client._generated.*",
    "flatbuffers",
]
follow_imports = "skip"
ignore_missing_imports = true

# Tests look like top-level `tests` modules (one per workspace member because
# each lives under its member's directory) and any nested `tests.*` packages.
# The override is added back as soon as real test files exist; today both
# patterns are no-ops because the smoke tests are intentionally tiny and
# already pass strict checks. Tracked: 02_shared_infra.md will introduce real
# tests that exercise this loosening.

###############################################################################
# pytest
###############################################################################

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    # importlib mode lets us have files with the same basename in
    # different directories (e.g. one `test_smoke.py` per workspace member)
    # without `tests/__init__.py` and without rootdir-import surprises.
    "--import-mode=importlib",
]
testpaths = [
    "packages/common/tests",
    "services/orchestrator/tests",
    "services/market_data/tests",
    "services/md_ingester/tests",
]
asyncio_mode = "auto"
markers = [
    # Tests that talk to a real Postgres holding the legacy MD schema
    # (see services/market_data/tests/test_db_integration.py). Skipped
    # by default so the fast suite stays hermetic; run with
    # `uv run pytest -m md_db` once QUANTRA_MD_TEST_DSN is set.
    "md_db: integration test against the legacy MD database",
    # MD-ingester integration tests against the new md.* schema this
    # monorepo's Alembic provisions. Skipped by default; run with
    # `uv run pytest -m md_ingester_db` once
    # QUANTRA_MD_INGESTER_TEST_DSN and QUANTRA_MD_INGESTER_TEST_ADMIN_DSN
    # are exported. Same gating idea as `md_db` (D48).
    "md_ingester_db: integration test that writes to the monorepo md.* schema",
    # Orchestrator integration tests that talk to a live Postgres
    # holding the new app.* schema (D48 / D50 family). Skipped by
    # default; run with `uv run pytest -m orchestrator_db` once
    # QUANTRA_ORCHESTRATOR_TEST_APP_RO_DSN and
    # QUANTRA_ORCHESTRATOR_TEST_ADMIN_DSN are exported.
    "orchestrator_db: integration test against the app.* schema",
    # Orchestrator integration tests that hit a real MD service over
    # HTTP (mirrors D48 / D50 / D59 gating). Skipped by default; run
    # with `uv run pytest -m orchestrator_md` once
    # QUANTRA_ORCHESTRATOR_TEST_MD_BASE_URL is exported (and a
    # canonical_id is seeded in the MD store).
    "orchestrator_md: integration test against a real MD service",
    # Orchestrator integration tests that round-trip an RPC against a
    # live pricing engine over gRPC. Skipped by default until the
    # real engine bindings land in Phase 6/7; run with
    # `uv run pytest -m orchestrator_engine` once
    # QUANTRA_ORCHESTRATOR_TEST_ENGINE_GRPC_TARGET is exported. Same
    # gating shape as `orchestrator_md` (D68).
    "orchestrator_engine: integration test against a real pricing engine over gRPC",
    # Per-product live-engine marker for the IR-swap pricing endpoint
    # (orchestrator/06_swap_ir.md). Same env var as `orchestrator_engine`
    # (D71); a distinct marker lets CI run per-product live tests
    # independently so a swaption-side flake doesn't gate the swap_ir
    # check, and vice versa. Phase 3 plans 07-11 add their own
    # `orchestrator_engine_<product>` marker on the same pattern.
    "orchestrator_engine_swap_ir: live-engine integration test for POST /v1/price/swap/ir",
    # Per-product live-engine marker for the swaption pricing endpoint
    # (orchestrator/07_swaption.md). Same gating env var and shape as
    # `orchestrator_engine_swap_ir` (D76); a separate marker keeps the
    # swaption live-engine opt-in independent of the swap_ir one so
    # CI can run them on different cadences.
    "orchestrator_engine_swaption: live-engine integration test for POST /v1/price/swaption",
    # Per-product live-engine marker for the fixed-rate bond pricing
    # endpoint (orchestrator/08_bonds.md). Same gating env var
    # (QUANTRA_ORCHESTRATOR_TEST_ENGINE_GRPC_TARGET) and shape as
    # `orchestrator_engine_swap_ir` (D76); a separate marker keeps
    # the bond live-engine opt-in independent of the rate-products
    # ones so a bond-side flake doesn't gate the swap_ir check.
    "orchestrator_engine_bonds_fixed: live-engine integration test for POST /v1/price/bonds/fixed",
    # Per-product live-engine marker for the floating-rate bond
    # pricing endpoint (orchestrator/08_bonds.md). Separate from the
    # fixed-rate marker because floating-rate bonds exercise an
    # additional curve role (projection) + index resolution, so the
    # two opt-ins live on their own cadences.
    "orchestrator_engine_bonds_floating: live-engine integration test for POST /v1/price/bonds/floating",
    # Per-product live-engine marker for the CDS pricing endpoint
    # (orchestrator/09_cds.md). Same gating env var
    # (QUANTRA_ORCHESTRATOR_TEST_ENGINE_GRPC_TARGET) and shape as
    # `orchestrator_engine_swap_ir` (D76); a separate marker keeps
    # the CDS live-engine opt-in independent of the rates / bond
    # markers because CDS is the first product to round-trip the
    # credit-curve + CDS-model wire shapes and its layer-3 surface
    # is more likely to flake on engine schema churn while those
    # land.
    "orchestrator_engine_cds: live-engine integration test for POST /v1/price/cds",
    # Live-engine integration test for the equity-options pricing endpoint
    # (orchestrator/10_equity_options.md). Same gating env var
    # (QUANTRA_ORCHESTRATOR_TEST_ENGINE_GRPC_TARGET) and shape as
    # `orchestrator_engine_swap_ir` (D76); a separate marker keeps
    # the equity-options live-engine opt-in independent of the rates /
    # bond / cds markers because equity options is the first product
    # to round-trip the BlackVolSpec + EquityVanillaModelSpec +
    # EquityUnderlyingSpec wire shapes and its layer-3 surface is more
    # likely to flake on engine schema churn while those land.
    "orchestrator_engine_equity_options: live-engine integration test for POST /v1/price/equity-option",
    # Live-engine integration test for the inflation-swaps pricing
    # endpoint (orchestrator/11_swap_inflation.md). Same gating env var
    # (QUANTRA_ORCHESTRATOR_TEST_ENGINE_GRPC_TARGET) and shape as
    # `orchestrator_engine_swap_ir` (D76); a separate marker keeps
    # the inflation-swap live-engine opt-in independent of the rates /
    # bond / CDS / equity-options ones so an inflation-side flake
    # doesn't gate the rest.
    "orchestrator_engine_swaps_inflation: live-engine integration test for POST /v1/price/swaps/inflation",
    # O21 — per-product smoke against the FULL live stack (live engine
    # over gRPC + live MD service over HTTP + dev Postgres for seeding).
    # Distinct from the per-product ``orchestrator_engine_*`` markers
    # because those wire a stub MD client and never exercise the
    # MD-service deployment; O21 closes the gap that hid D129 (the MD
    # container wedged on the wrong DSN — every portal pricing request
    # 502'd in the recon and no hermetic / stub-MD test caught it).
    # Skipped by default. To run set the three env vars together:
    #   QUANTRA_ORCHESTRATOR_TEST_ENGINE_GRPC_TARGET (e.g. localhost:50051),
    #   QUANTRA_ORCHESTRATOR_TEST_MD_BASE_URL       (e.g. http://localhost:8082),
    #   QUANTRA_ORCHESTRATOR_MD_SMOKE_DSN           (md_rw asyncpg DSN).
    # Tests seed minimal md.canonical_ids + md.quote_points rows under
    # the md_rw role and DELETE the seeded ids at exit.
    "orchestrator_md_smoke: per-product smoke against live engine + live MD + seeded md.* rows",
    # D135 — scheduler-driven CLI smoke against a live ``md_rw`` pool.
    # Uses a fixture fetcher (no live vendor call — keeps FRED quota
    # untouched) and asserts ``md.quote_points`` populates + a follow-on
    # ``build-snapshot`` advances ``md.snapshots.version_etag``. Gated on
    # QUANTRA_MD_INGESTER_TEST_DSN so it skips on a fresh checkout.
    "md_ingest_smoke: scheduler-driven CLI smoke against a live md_rw Postgres pool",
    # D136 / 17d — live readiness-transition test for ``GET /ready``.
    # Distinct from ``orchestrator_md_smoke`` because the test bounces
    # the ``quantra-backend-market-data`` container (``docker compose
    # stop`` / ``docker compose up -d``) to drive /ready through the
    # 200 → 503 → 200 transition, and asserts /health stays 200 +
    # /metrics records the MD upstream failure counter. The host must
    # have docker access (rootful or rootless) — gated on the engine /
    # MD env vars from O21 plus the explicit
    # ``QUANTRA_ORCHESTRATOR_READY_SMOKE`` opt-in so a contributor
    # without docker rights does not auto-run the lane.
    "orchestrator_ready_smoke: live MD-down/MD-up transition test for GET /ready",
]
filterwarnings = [
    "error",
]
