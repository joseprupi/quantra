# Self-hosted portal nginx config — TEMPLATE.
#
# This file is NOT used verbatim. docker/entrypoint.sh runs `envsubst` over it
# at container start, substituting ONLY ${ORCHESTRATOR_PROXY_TARGET} and
# ${MD_PROXY_TARGET} (nginx's own $-variables like $uri / $host are preserved),
# and writes the result to /etc/nginx/conf.d/default.conf before nginx boots.
#
# The reverse proxy is the whole point of the self-hosted image: the browser
# only ever talks to the PORTAL origin. The orchestrator ships no CORS headers,
# so a browser calling an absolute cross-origin orchestrator URL is blocked on
# every request. Proxying its API paths here makes those calls same-origin, so
# there is no CORS preflight and nothing to configure on the orchestrator.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Runtime config is rewritten on every container start — never cache it, or
    # a re-pointed image would keep serving a stale orchestrator URL.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Same-origin reverse proxy to the orchestrator. `/v1/` is the entire public
    # API the portal calls (pricing + every entity CRUD path); `/auth/` covers
    # dev-bypass provisioning (`/auth/provision`, `/auth/whoami`). These are the
    # only two orchestrator prefixes the app reaches at runtime — the legacy
    # `quantra-api.ts` (`/price-*`, `/health`) targets a different, external
    # service and has no live callers; `/debug` appears only in generated types.
    #
    # ${ORCHESTRATOR_PROXY_TARGET} carries no path, so nginx forwards the
    # original request URI unchanged (e.g. /v1/price/swap/ir → orchestrator).
    location /v1/ {
        proxy_pass ${ORCHESTRATOR_PROXY_TARGET};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass ${ORCHESTRATOR_PROXY_TARGET};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin reverse proxy to the bundle's LOCAL market_data service
    # (Quote Book / MD-catalog reads: /catalog/*, /series*, /quotes/*,
    # /month/*, /status, /snapshots/*). Without this the Quote Book would read
    # an EXTERNAL cloud catalog and never show user-imported quotes (O58). The
    # client (marketDataBackend.ts) prefixes all these reads with the runtime
    # `marketDataUrl` = `/_md` in the self-hosted image, so they arrive here as
    # `/_md/<md-path>`. The clean `/_md/` mount avoids proxying broad, generic
    # top-level prefixes (`/series`, `/status`, `/month`) that would collide
    # with the SPA `/` fallback.
    #
    # The proxy_pass carries a TRAILING-SLASH URI (`${MD_PROXY_TARGET}/`), so
    # nginx STRIPS the matched `/_md/` prefix: /_md/catalog/series → market_data
    # /catalog/series. MD_PROXY_TARGET itself stays clean (no path), mirroring
    # ORCHESTRATOR_PROXY_TARGET.
    location /_md/ {
        proxy_pass ${MD_PROXY_TARGET}/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback: unknown paths resolve to index.html so client-side
    # routes (e.g. /products/ir-swap) load on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
