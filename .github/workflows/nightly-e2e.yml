###############################################################################
# nightly-e2e — the full-coverage browser truth map, every night.
#
# Boots the WHOLE application from source on the runner (repo-root
# docker-compose.yml: postgres + public pricing engine + orchestrator +
# market-data + real BoE/Treasury/ECB boot ingests; FRED skips without a key,
# which is fine), waits for real market data to land, then drives the
# 45-journey Playwright suite (frontend/e2e/full) against the running portal
# with the UI-vs-API pricing parity oracle.
#
# INFORMATIONAL: this is a nightly canary, NOT a merge gate. It exercises the
# live public data feeds, so a vendor outage can fail it without any code
# being wrong — read the uploaded report/traces before assuming a regression.
###############################################################################
name: nightly-e2e

on:
  schedule:
    # 03:00 UTC — after the previous day's feeds (last cron tick 22:00 UTC)
    # have long settled.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Generous: from-source image builds + real-feed ingests + 45 journeys.
    timeout-minutes: 45
    env:
      # Point the full suite at the compose portal; also tells the Playwright
      # config NOT to spawn its own Vite dev server.
      E2E_PORTAL_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - name: Build + start the full stack (from source)
        run: docker compose up -d --build

      - name: Wait for real market data (latest-date non-null, bounded)
        # The portal proxies /v1 to the orchestrator (same-origin), so this
        # exercises the exact path the browser uses. latest_date stays null
        # until the boot ingests (BoE OIS / Treasury / ECB) land.
        run: |
          for i in $(seq 1 90); do
            latest=$(curl -fsS "$E2E_PORTAL_URL/v1/market-data/latest-date" 2>/dev/null \
                       | jq -r '.latest_date // empty' || true)
            if [ -n "$latest" ]; then
              echo "Real market data landed: latest_date=$latest (after ~$((i*10))s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::No real market data after 15 minutes (latest_date still null)."
          docker compose ps
          docker compose logs --tail 100 orchestrator boe-ois-ingest treasury-ingest ecb-ingest migrate init-seed
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the full e2e journey suite
        working-directory: frontend
        # Add the HTML reporter (the repo config uses `list`) so the run
        # always leaves an uploadable report in frontend/playwright-report.
        run: npm run test:e2e:full -- --reporter=list,html

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces + screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stack diagnostics (on failure)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200 orchestrator market_data quantra-engine portal

      - name: Tear down the stack
        if: always()
        run: docker compose down
